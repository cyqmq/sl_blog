name = "nav-blog-demo"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# 站点可配置项（音乐播放器等）存储。本地预览可用占位 id，wrangler pages dev 会做本地模拟；
# 生产环境请在 Cloudflare 控制台创建 KV 命名空间，并把 id 替换为真实值，同时在
# Pages 项目设置里绑定变量名 SITE_CONFIG。
kv_namespaces = [
  { binding = "SITE_CONFIG", id = "00000000000000000000000000000001" }
]
